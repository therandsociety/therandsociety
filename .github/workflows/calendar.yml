# Rebuilds the members' calendar feeds (cal/*.ics) whenever the dates file changes,
# so subscribed calendars pick up edits on their next refresh.
name: Update calendar feeds
on:
  push:
    branches: [main]
    paths: ['data.json', 'tools/build_ics.py']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: calendar-feeds
  cancel-in-progress: false
jobs:
  feeds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the feeds
        run: python3 tools/build_ics.py
      - name: Save them
        id: save
        run: |
          if [ -n "$(git status --porcelain cal)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add cal
            git commit -m "Update calendar feeds from data.json"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Republish the site
        if: steps.save.outputs.changed == 'true'
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
