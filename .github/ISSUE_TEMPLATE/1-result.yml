        - "Fri 18 Dec · Analyst: Sector scope and source map filed [a-scope]"
        - "Fri 15 Jan · Theme primer in, sector briefs to review [jan15]"
        - "Fri 15 Jan · Analyst: Sector brief and watchlist submitted [a-brief]"
        - "Fri 22 Jan · Thesis candidates pre-cleared [jan22]"
