    validations:
      required: true
  - type: dropdown
    id: members
    attributes:
      label: "Members"
      description: "Choose every Member with this result."
      multiple: true
      options:
        - "Head of Research [hor]"
        - "President & IC Chair [pres]"
        - "Portfolio Manager [pm]"
        - "COO & External Affairs [coo]"
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: "Result"
      options:
        - "Accepted [accepted]"
        - "Accepted, minor corrections [minor]"
        - "Revision required [revise]"
        - "Not completed [incomplete]"
        - "Clear the record [clear]"
    validations:
      required: true
  - type: textarea
    id: note
    attributes:
      label: "Note"
      description: "Optional: the reviewer, or what needs correcting."
    validations:
      required: false
