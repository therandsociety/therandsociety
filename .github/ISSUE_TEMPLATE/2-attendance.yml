name: "Record attendance"
description: "Who attended a meeting, from its minutes. Every meeting counts towards the 70% rule."
title: "Attendance"
body:
  - type: markdown
    attributes:
      value: "Records attendance in data.json. Every meeting counts towards the 70% rule (Constitution 2.6). An approved absence, including a notified November exam exemption, is Excused and doesn’t count against the Member. This page is public and stays as the dated record: use roles, never names."
