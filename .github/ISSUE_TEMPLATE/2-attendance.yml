        - "Sun 7 Feb · Learning Session 3: Technology, competition and financial inclusion [ls3]"
        - "Sun 14 Feb · Formal IC 4: Pitch IC A [pica]"
        - "Sun 21 Feb · Formal IC 5: Pitch IC B [picb]"
        - "Sun 28 Feb · Formal IC 6 and H1 close [close]"
