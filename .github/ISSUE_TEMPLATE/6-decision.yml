# Built by tools/forms.py from data.json. Edit that script, not this file.
name: "Record a decision"
description: "An IC decision or written resolution, with its vote, rationale and review date, for the decision register."
title: "Decision"
body:
  - type: markdown
    attributes:
      value: "Adds the decision to the register on the Meetings page, with a review date (a month later unless you say otherwise) so the IC can check whether it played out as the rationale expected. Record it from the approved minutes. This page is public and stays as the dated record: use roles, never names."
  - type: dropdown
    id: meeting
    attributes:
      label: "Taken at"
      options:
        - "Sun 6 Dec · Formal IC 1 [ic1]"
        - "Sun 13 Dec · Learning Session 1: How financial services companies make money [ls1]"
        - "Sun 17 Jan · Formal IC 2 [ic2]"
        - "Sun 24 Jan · Learning Session 2: Valuing financial companies [ls2]"
        - "Sun 31 Jan · Formal IC 3: Interim Progress Report [jan31]"
        - "Sun 7 Feb · Learning Session 3: Technology, competition and financial inclusion [ls3]"
        - "Sun 14 Feb · Formal IC 4: Pitch IC A [pica]"
        - "Sun 21 Feb · Formal IC 5: Pitch IC B [picb]"
        - "Sun 28 Feb · Formal IC 6 and H1 close [close]"
        - "Written resolution [resolution]"
    validations:
      required: true
  - type: input
    id: date
    attributes:
      label: "Date of a written resolution"
      description: "YYYY-MM-DD. Only for a written resolution; a meeting uses its own date."
    validations:
      required: false
  - type: input
    id: title
    attributes:
      label: "Decision"
      description: "One line, such as: Approve the Portfolio Framework."
    validations:
      required: true
  - type: dropdown
    id: outcome
    attributes:
      label: "Outcome"
      options:
        - "Approved [approved]"
        - "Not approved [rejected]"
        - "Deferred [deferred]"
        - "Noted [noted]"
    validations:
      required: true
  - type: input
    id: vote
    attributes:
      label: "Vote"
      description: "As minuted, roles not names."
      placeholder: "3 for, 0 against, 1 absent"
    validations:
      required: false
  - type: textarea
    id: rationale
    attributes:
      label: "Rationale"
      description: "Why, in two or three lines."
    validations:
      required: true
  - type: dropdown
    id: owner
    attributes:
      label: "Owner"
      options:
        - "Head of Research [hor]"
        - "President & IC Chair [pres]"
        - "Portfolio Manager [pm]"
        - "COO & External Affairs [coo]"
        - "No owner [none]"
    validations:
      required: true
  - type: input
    id: review
    attributes:
      label: "Review on"
      description: "Optional, YYYY-MM-DD. Leave blank for a month after the decision; write none for no review."
    validations:
      required: false
